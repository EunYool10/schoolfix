<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Shield Badge Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Soft drop shadow for badge -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- School Facility Silhouette (Crisp White) -->
  <!-- Clock / Bell Tower -->
  <rect x="29" y="8" width="6" height="5" rx="1" fill="#FFFFFF" />
  <circle cx="32" cy="10.5" r="1.2" fill="#1D4ED8" />

  <!-- Triangular Pediment / Gable Roof -->
  <polygon points="32,13 13,24 51,24" fill="#FFFFFF" />
  <!-- Architrave / Entablature beam -->
  <rect x="12" y="24" width="40" height="3" rx="1" fill="#E2E8F0" />

  <!-- Columns -->
  <rect x="16" y="28" width="5" height="15" rx="1" fill="#FFFFFF" />
  <rect x="25" y="28" width="5" height="15" rx="1" fill="#FFFFFF" />
  <rect x="34" y="28" width="5" height="15" rx="1" fill="#FFFFFF" />
  <rect x="43" y="28" width="5" height="9" rx="1" fill="#FFFFFF" />

  <!-- Foundation / Steps -->
  <rect x="12" y="44" width="23" height="4" rx="1" fill="#E2E8F0" />
  <rect x="10" y="48" width="26" height="3" rx="1" fill="#CBD5E1" />

  <!-- Safety & Repair Badge (Shield with Checkmark) -->
  <g filter="url(#badgeShadow)">
    <!-- Outer white rim for shield -->
    <path d="M 46 30 C 54 30 57 33 57 41 C 57 49 46 56 46 56 C 46 56 35 49 35 41 C 35 33 38 30 46 30 Z"
          fill="#FFFFFF" />
    <!-- Inner emerald shield -->
    <path d="M 46 32 C 52.5 32 55 34.5 55 41 C 55 47.5 46 53.5 46 53.5 C 46 53.5 37 47.5 37 41 C 37 34.5 39.5 32 46 32 Z"
          fill="url(#shieldGrad)" />
    <!-- Bold white checkmark -->
    <polyline points="41,41.5 44.5,45 51,37.5"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round" />
  </g>
</svg>
