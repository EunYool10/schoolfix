# Render 배포 설정 (Blueprint) — 무료 플랜
# 대시보드에서 "New > Blueprint"로 저장소를 연결하면 이 파일대로 구성됩니다.
#
# ── 무료 플랜의 제약 ─────────────────────────────────────────────
# 1) 영구 디스크를 쓸 수 없습니다. 컨테이너 파일시스템에 쓰기는 되지만
#    재배포·재시작 시 사라집니다. 즉 data/*.json 의 신고·사용자·세션이
#    모두 초기화되며, 로그인도 다시 해야 합니다. (시연/테스트용으로 적합)
# 2) 약 15분간 요청이 없으면 서비스가 잠들고, 다음 요청에서 깨어나는 데
#    30~60초가 걸립니다. 이때도 데이터는 초기화됩니다.
#
# 영구 보관이 필요해지면 plan 을 starter 로 올리고 아래 주석의
# disk / DATA_DIR 설정을 되살리면 됩니다.

services:
  - type: web
    name: schoolfix
    runtime: node
    plan: free
    region: singapore # 한국에서 가장 가까운 리전
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    # ── 유료 플랜으로 올릴 때 활성화 ──
    # disk:
    #   name: schoolfix-data
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # 아래 두 값은 커밋하지 않습니다 — Render 대시보드 > Environment 에서 직접 입력하세요.
      - key: OPENAI_API_KEY
        sync: false
      # 신고 삭제에 필요한 관리자 비밀번호의 bcrypt 해시.
      # 이 항목이 없으면 삭제 기능이 영구히 503 을 반환한다.
      - key: ADMIN_PASSWORD_HASH
        sync: false

      # ── 유료 플랜으로 올릴 때 활성화 (위 mountPath 와 일치시킬 것) ──
      # - key: DATA_DIR
      #   value: /var/data

    # PORT 는 Render 가 자동 주입하며 server.ts 가 process.env.PORT 로 읽습니다.
    # DATA_DIR 을 지정하지 않으면 server.ts 는 프로젝트의 data/ 를 사용하고,
    # 해당 폴더가 없으면 부팅 시 자동 생성합니다.
